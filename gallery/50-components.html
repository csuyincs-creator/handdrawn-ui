<style>.drawably-host {
  --drawably-ease: cubic-bezier(0.2, 0, 0, 1);
  position: relative;
  isolation: isolate;
  font-family: Inter, system-ui, sans-serif;
}

.drawably-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: -1;
}

.drawably-svg path {
  fill: none;
  stroke: var(--drawably-ink, var(--drawably-stroke, #2724d1));
  stroke-width: var(--drawably-width, 2);
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* one animation on the svg steps a frame counter; every path derives its
   opacity from the inherited value in the same style pass, so frames can never
   sample out of step with each other (three per-path animations flashed blank
   on tab refocus when their clocks re-aligned separately) */
@property --drawably-frame {
  syntax: "<integer>";
  inherits: true;
  initial-value: 0;
}

.drawably-svg {
  --drawably-frame: 0;
  animation: drawably-boil 1200ms step-end infinite;
}

@keyframes drawably-boil {
  0% { --drawably-frame: 0; }
  33.33% { --drawably-frame: 1; }
  66.67% { --drawably-frame: 2; }
}

/* 1 when the counter equals this frame's index, 0 for the other two */
.drawably-boil {
  --drawably-i: 0;
  opacity: clamp(0, 1 - (var(--drawably-frame) - var(--drawably-i)) * (var(--drawably-frame) - var(--drawably-i)), 1);
}

.drawably-boil[data-i="1"] {
  --drawably-i: 1;
}

.drawably-boil[data-i="2"] {
  --drawably-i: 2;
}

.drawably-svg .drawably-blob {
  fill: var(--drawably-ink, var(--drawably-fill, #2724d1));
  stroke: var(--drawably-ink, var(--drawably-fill, #2724d1));
  stroke-width: 4;
}

.drawably-svg .drawably-scribble {
  stroke-width: 1.5;
}

.drawably-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 14px;
  border: 0;
  background: none;
  font: inherit;
  font-family: Inter, system-ui, sans-serif;
  color: var(--drawably-ink, var(--drawably-stroke, #2724d1));
  cursor: pointer;
  outline: none;
  transition: transform 120ms ease;
}

/* press: the pen pushes into the paper — the sketch sinks and the outline
   thickens; hover lifts it and tints the inside with the stroke at 10%, the
   same wash the picker uses for its hovered option */
.drawably-button:active {
  transform: translateY(1px) scale(0.98);
}

.drawably-button .drawably-outline {
  transition: stroke-width 120ms ease, fill 120ms ease;
}

.drawably-button:active .drawably-outline {
  stroke-width: calc(var(--drawably-width, 2) * 1.4);
}

@media (hover: hover) {
  .drawably-button:hover:not(:disabled, [data-state="loading"]) {
    transform: translateY(-1px);
  }

  .drawably-button:not(.drawably-button--solid):hover:not(:disabled) .drawably-outline {
    fill: color-mix(in srgb, var(--drawably-ink, var(--drawably-stroke, #2724d1)) 10%, transparent);
  }

  .drawably-button:hover:active {
    transform: translateY(1px) scale(0.98);
  }
}

.drawably-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  transform: none;
}

.drawably-button--neutral {
  --drawably-stroke: #6e675f;
  --drawably-fill: #6e675f;
}

.drawably-button--danger {
  --drawably-stroke: var(--drawably-error, #d12724);
  --drawably-fill: var(--drawably-error, #d12724);
}

.drawably-button[data-state="error"] {
  --drawably-ink: var(--drawably-error, #d12724);
}

.drawably-button[data-state="success"] {
  --drawably-ink: var(--drawably-success, #188a42);
}

.drawably-button[data-state="loading"] {
  cursor: progress;
  opacity: 0.6;
}

.drawably-button[data-state="loading"] .drawably-svg {
  animation-duration: 450ms;
}

.drawably-button--solid {
  color: var(--drawably-paper, #fff);
}

.drawably-svg .drawably-focus {
  visibility: hidden;
  stroke-width: 1.5;
}

.drawably-host:is(:focus-visible, :has(:focus-visible)) .drawably-focus {
  visibility: visible;
}

.drawably-checkbox,
.drawably-radio {
  display: inline-block;
  width: 22px;
  height: 22px;
}

.drawably-toggle {
  display: inline-block;
  width: 44px;
  height: 24px;
}

:is(.drawably-checkbox, .drawably-radio, .drawably-toggle) input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.drawably-svg .drawably-dot {
  fill: var(--drawably-ink, var(--drawably-fill, #2724d1));
  stroke: var(--drawably-ink, var(--drawably-fill, #2724d1));
  visibility: hidden;
  transform: scale(0.5);
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 160ms var(--drawably-ease);
}

.drawably-radio[data-checked] .drawably-dot {
  visibility: visible;
  transform: scale(1);
}

.drawably-svg .drawably-knob {
  transition: transform 160ms var(--drawably-ease);
}

/* travel = toggle width 44px minus height 24px; resizing the toggle in CSS
   means overriding this too */
.drawably-toggle[data-checked] .drawably-knob {
  transform: translateX(20px);
}

.drawably-divider {
  display: block;
  height: 10px;
  border: 0;
}

.drawably-svg .drawably-check {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  transition: stroke-dashoffset 240ms var(--drawably-ease);
}

.drawably-checkbox[data-checked] .drawably-check {
  stroke-dashoffset: 0;
}

.drawably-inputbox,
.drawably-textarea,
.drawably-select {
  display: inline-block;
}

:is(.drawably-inputbox, .drawably-textarea, .drawably-select) :is(input, textarea, select) {
  border: 0;
  background: none;
  font: inherit;
  color: inherit;
  padding: 8px 12px;
  width: 100%;
  box-sizing: border-box;
  outline: none;
}

.drawably-textarea textarea {
  display: block;
  resize: vertical;
}

/* right padding reserves the gutter the sketched chevron sits in */
.drawably-select select {
  appearance: none;
  padding-right: 34px;
  cursor: pointer;
}

/* Chromium's customisable select lets the options list be styled and renders
   the select's children inside it, which is where the .drawably-picker frame
   lives; elsewhere the OS draws the popup and this block is ignored */
@supports (appearance: base-select) {
  .drawably-select select,
  .drawably-select select::picker(select) {
    appearance: base-select;
  }

  .drawably-select select::picker-icon {
    display: none;
  }

  /* the picker is a fixed-position popover, so the absolute frame fills it.
     ponytail: it scrolls with a long option list; clip the frame if that shows */
  .drawably-select select::picker(select) {
    margin-top: 4px;
    padding: 6px;
    border: 0;
    background: var(--drawably-paper, #fff);
    color: inherit;
    font: inherit;
  }

  .drawably-select option {
    padding: 4px 8px;
    border-radius: 3px;
  }

  .drawably-select option:is(:hover, :focus-visible) {
    background: color-mix(in srgb, var(--drawably-stroke, #2724d1) 10%, transparent);
  }

  /* every option gets the same empty box so text lines up whether or not it
     is chosen; the chosen one paints the attacher's sketched check through it.
     Chromium lays the option out as flex with a 0.5em gap, so no margin here */
  .drawably-select option::checkmark {
    content: "";
    display: inline-block;
    width: 0.875em;
    height: 0.875em;
  }

  .drawably-select option:checked::checkmark {
    background: var(--drawably-ink, var(--drawably-stroke, #2724d1));
    mask: var(--drawably-check) center / contain no-repeat;
  }
}

.drawably-badge {
  display: inline-block;
  padding: 1px 7px;
  font:
    500 12px/1.4 Geist Mono,
    ui-monospace,
    monospace;
  color: var(--drawably-ink, var(--drawably-stroke, #2724d1));
}

/* padding is the gutter the marker is drawn into (see MARKER_LEFT) */
.drawably-list {
  list-style: none;
  padding-left: 24px;
}

.drawably-card {
  padding: 16px;
}

/* marker wash: stroke as wide as the scribble gap so the hatching reads as
   one swipe, multiplied so the text stays legible over it. stroke-opacity,
   not opacity — the boil keyframes animate opacity and would override it */
.drawably-svg .drawably-wash {
  stroke: var(--drawably-ink, var(--drawably-fill, #2724d1));
  stroke-width: 6;
  stroke-opacity: 0.3;
  mix-blend-mode: multiply;
}

/* text decorations sit on body copy, where the 2px control stroke reads heavy */
:is(.drawably-underline, .drawably-circle) .drawably-svg path {
  stroke-width: var(--drawably-width, 1.5);
}

/* body-level overlay positioned in document coordinates by the attacher;
   sits above content since it annotates it */
.drawably-arrow {
  inset: auto;
  z-index: 1;
}

@media (prefers-reduced-motion: reduce) {
  .drawably-svg {
    animation: none;
  }
  .drawably-svg .drawably-check,
  .drawably-svg .drawably-dot,
  .drawably-svg .drawably-knob {
    transition: none;
  }
}

/* composites */
.drawably-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 3px 10px 3px 6px;
  cursor: pointer;
}

.drawably-chip .drawably-checkbox {
  scale: 0.8;
}

.drawably-tabs {
  display: flex;
  gap: 18px;
}

.drawably-tabs > * {
  cursor: pointer;
}

.drawably-tooltip {
  display: inline-block;
  padding: 2px 10px;
}

.drawably-alert {
  display: flex;
  align-items: center;
  gap: 8px;
  width: max-content;
  max-width: 100%;
  padding: 8px 12px;
}

.drawably-alert [data-tag] {
  padding: 1px 6px;
}

.drawably-kbd {
  padding: 2px 8px;
  font:
    500 13px/1.4 Geist Mono,
    ui-monospace,
    monospace;
}

.drawably-quote {
  margin: 0;
}

.drawably-quote footer {
  margin-top: 10px;
  padding-top: 8px;
}

.drawably-pager {
  display: flex;
  gap: 6px;
}

.drawably-pager > button {
  min-width: 34px;
}


/* ============================================================
   手绘组件 50 · 通用样式
   注意：手绘线条一律由 SVG 生成，这里只做布局，绝不使用 CSS border 伪装
   ============================================================ */

:root {
  --ink: #18181b;
  --ink-2: #52525b;
  --ink-3: #a1a1aa;
  --paper: #e3e3e1;
  --panel: #efeeec;
  --drawably-stroke: #2724d1;
  --drawably-fill: #2724d1;
  --drawably-paper: #e3e3e1;
  --drawably-width: 2;
  --danger: #d12724;
  --success: #188a42;
  --warn: #b45309;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

/* 主题：铅笔 / 朱红 / 墨黑 */
html[data-pen="pencil"] {
  --drawably-stroke: #3f3f46;
  --drawably-fill: #71717a;
  --drawably-width: 1.6;
}
html[data-pen="marker"] {
  --drawably-stroke: #d12724;
  --drawably-fill: #f59e0b;
  --drawably-width: 2.4;
}
html[data-pen="ink"] {
  --drawably-stroke: #18181b;
  --drawably-fill: #52525b;
  --drawably-width: 2;
}
html[data-pen="forest"] {
  --drawably-stroke: #15803d;
  --drawably-fill: #65a30d;
  --drawably-width: 2;
}

* { box-sizing: border-box; }

/* 库会把 Inter 强加到每个 host 上且不自带字体 —— 必须覆盖，否则装饰文字会被换字体 */
:root :is(.drawably-host, .drawably-button, .drawably-badge, .drawably-kbd) {
  font-family: inherit;
}

html { -webkit-font-smoothing: antialiased; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.6 Inter, ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  letter-spacing: -0.005em;
}

/* 纸张噪点，让底色不那么平 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.035;
  z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- 页头 ---------- */
.hd {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(8px);
  background: color-mix(in srgb, var(--paper) 82%, transparent);
}
.hd-in {
  max-width: 1180px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.brand { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.brand small { font-weight: 400; color: var(--ink-3); font-size: 13px; margin-left: 8px; }
.spacer { flex: 1; }

.penbar { display: flex; gap: 6px; align-items: center; }
.pen-dot {
  width: 22px; height: 22px; cursor: pointer;
  border-radius: 50%;
  padding: 0; border: 0; background: none;
  position: relative;
}
.pen-dot i {
  position: absolute; inset: 5px; border-radius: 50%;
  background: var(--c);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .18);
}
.pen-dot[aria-pressed="true"] { outline: 2px solid var(--drawably-stroke); outline-offset: 2px; }

/* ---------- 布局 ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 24px 120px; position: relative; z-index: 1; }

.intro { margin: 14px 0 6px; color: var(--ink-2); max-width: 74ch; }
.intro b { color: var(--ink); }

.sec { margin: 46px 0 0; scroll-margin-top: 76px; }
.sec-hd { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.sec-n {
  font: 600 12px/1 ui-monospace, monospace;
  color: var(--ink-3);
  letter-spacing: .06em;
}
.sec-t { font-size: 17px; font-weight: 600; margin: 0; }
.sec-d { color: var(--ink-2); font-size: 13.5px; margin: 2px 0 0; max-width: 78ch; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  align-items: start;      /* 卡片按自身高度，不被拉平成等高的大空框 */
  gap: 20px;
  margin-top: 18px;
}
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }

/* 组件卡片：外框由 JS 画，这里只留内边距 */
.cell { min-width: 0; scroll-margin-top: 84px; }
.cell-in { padding: 18px 16px 16px; position: relative; }
.cap {
  font: 500 11.5px/1.4 ui-monospace, monospace;
  color: var(--ink-3);
  margin-bottom: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.cap b { color: var(--ink-2); font-weight: 600; font-family: inherit; }
.demo { min-height: 44px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.demo.col { flex-direction: column; align-items: stretch; }

/* ---------- 目录 ---------- */
.toc {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  margin: 20px 0 0;
  padding: 0;
  list-style: none;
}
.toc a {
  color: var(--ink-2);
  text-decoration: none;
  font-size: 13px;
  padding: 3px 2px;
}
.toc a:hover { color: var(--drawably-stroke); }

/* ---------- 通用小部件 ---------- */
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: grid; gap: 10px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
.muted { color: var(--ink-3); }
.tiny { font-size: 12px; }
.center { text-align: center; }
.fill { width: 100%; }

/* ---------------------------------------------------------------
   原生控件边框必须清零。
   手绘外框是画出来的，浏览器自带的 outset / inset 会让控件出现
   "手绘线 + 一圈直边"的双重边框 —— 这是最容易漏掉的一条。
   --------------------------------------------------------------- */
button,
input,
select,
textarea {
  border: 0;
  background: none;
  font: inherit;
  color: inherit;
  -webkit-appearance: none;
  appearance: none;
}
button { cursor: pointer; }
.drawably-host { border: 0 !important; }
input::placeholder,
textarea::placeholder { color: var(--ink-3); }
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible { outline: none; }

/* ---------------------------------------------------------------
   关键：grid/flex 容器里若只有"内容全绝对定位"的子项，
   列宽/行宽会解析成 0，手绘线条就被画进 0 宽视口 = 看不见。
   .demo 是 flex，它的直接子项需要能伸展；.stack 是 grid，
   列宽必须显式给 1fr，否则 100% 宽度解析为 0。
   --------------------------------------------------------------- */
.stack { grid-template-columns: minmax(0, 1fr); width: 100%; }
.demo > * { min-width: 0; }
.demo.col > * { width: 100%; }
/* 行内的"撑满"元素：允许收缩，避免把 flex 行顶宽 */
.row > .fill { flex: 1 1 auto; min-width: 0; }

/* 手绘分隔线占位（由 drawablyDivider 接管 <hr>） */
hr.sk { border: 0; margin: 26px 0; }

/* 滚动条 */
* { scrollbar-width: thin; scrollbar-color: #b4b4b0 transparent; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* 窄屏 */
@media (max-width: 640px) {
  .grid, .grid.wide { grid-template-columns: 1fr; }
  .wrap { padding: 16px 16px 90px; }
  .hd-in { padding: 12px 16px; }
}

/* 手绘分隔线：<hr> 作为 flex 子项没有内在宽度会塌成 0，给出基础尺寸 */
hr.sk, .drawably-divider { border: 0; }
.row > hr.drawably-divider { flex: 1 1 40px; min-width: 40px; height: 10px; }
</style>
</head>
